<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HatScope · 数学绘图</title>
    <link rel="icon" href="hatter.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080810;
            --surface: #111120;
            --surface-hover: #181830;
            --surface-glass: rgba(17, 17, 32, 0.85);
            --border: rgba(255, 255, 255, 0.06);
            --border-strong: rgba(255, 255, 255, 0.10);
            --text: #e0e0f0;
            --text-secondary: #8888a0;
            --text-tertiary: #555570;
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dim: rgba(99, 102, 241, 0.15);
            --accent: #8b5cf6;
            --danger: #ef4444;
            --danger-dim: rgba(239, 68, 68, 0.12);
            --success: #10b981;
            --canvas-bg: #0c0c18;
            --grid-line: rgba(255, 255, 255, 0.03);
            --axis-line: rgba(255, 255, 255, 0.10);
            --radius: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            --sidebar-w: 340px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg: #f0f0f5;
            --surface: #ffffff;
            --surface-hover: #f5f5fa;
            --surface-glass: rgba(255, 255, 255, 0.90);
            --border: rgba(0, 0, 0, 0.06);
            --border-strong: rgba(0, 0, 0, 0.10);
            --text: #1a1a2e;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --primary-dim: rgba(99, 102, 241, 0.08);
            --danger-dim: rgba(239, 68, 68, 0.08);
            --canvas-bg: #ffffff;
            --grid-line: #f0f0f5;
            --axis-line: #d1d1d6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::selection { background: rgba(99, 102, 241, 0.25); color: var(--text); }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 100px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
        [data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.10); }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ========= Layout ========= */
        .app {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* ========= Canvas Area ========= */
        .canvas-area {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            overflow: hidden;
        }

        .canvas-area::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        #cartesianCanvas {
            display: block;
            background-color: var(--canvas-bg);
            border-radius: var(--radius-lg);
            cursor: crosshair;
            max-width: calc(100% - 32px);
            max-height: calc(100% - 32px);
            aspect-ratio: 1/1;
            box-shadow: 0 0 0 1px var(--border), 0 8px 40px rgba(0,0,0,0.3);
            transition: box-shadow var(--transition);
        }

        [data-theme="light"] #cartesianCanvas {
            box-shadow: 0 0 0 1px var(--border), 0 8px 40px rgba(0,0,0,0.08);
        }

        /* Canvas Floating Controls */
        .canvas-controls {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 6px;
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            z-index: 10;
        }

        .canvas-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            font-size: 0;
        }

        .canvas-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .canvas-btn:active { transform: scale(0.92); }

        .canvas-btn svg { width: 18px; height: 18px; }

        .canvas-btn.danger:hover {
            background: var(--danger-dim);
            color: var(--danger);
        }

        .canvas-btn.save-btn:hover {
            background: rgba(16, 185, 129, 0.12);
            color: var(--success);
        }

        .canvas-btn-divider {
            width: 24px;
            height: 1px;
            background: var(--border-strong);
            margin: 2px auto;
        }

        /* Canvas Coordinate Overlay */
        .canvas-coords {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 6px;
            z-index: 10;
            opacity: 0;
            transition: opacity var(--transition);
            pointer-events: none;
        }

        .canvas-area:hover .canvas-coords { opacity: 1; }

        .coord-chip {
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-secondary);
            font-family: 'Fira Code', monospace;
        }

        /* Canvas Empty Hint */
        .canvas-empty-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s;
        }

        .canvas-empty-hint.hidden { opacity: 0; }

        .empty-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .empty-icon svg { width: 28px; height: 28px; color: white; }

        .empty-text {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        .empty-sub {
            font-size: 0.72rem;
            color: var(--text-tertiary);
            opacity: 0.6;
        }

        /* ========= Sidebar ========= */
        .sidebar {
            width: var(--sidebar-w);
            min-width: var(--sidebar-w);
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-left: 1px solid var(--border);
            overflow: hidden;
        }

        .sidebar-header {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
        }

        .sidebar-logo svg { width: 18px; height: 18px; }

        .sidebar-title {
            font-weight: 700;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .sidebar-header-actions {
            display: flex;
            gap: 4px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            font-size: 0;
            text-decoration: none;
        }

        .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn svg { width: 16px; height: 16px; }

        /* Sidebar Body (scrollable) */
        .sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }

        /* Preset Gallery */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .preset-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 6px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            transition: all var(--transition);
        }

        .preset-card:hover {
            border-color: var(--border-strong);
            background: var(--surface-hover);
            transform: translateY(-1px);
        }

        .preset-card:active { transform: scale(0.96); }

        .preset-card canvas {
            width: 100%;
            aspect-ratio: 4/3;
            border-radius: 6px;
            pointer-events: none;
        }

        .preset-label {
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--text-secondary);
            font-family: 'Fira Code', monospace;
        }

        /* Model Selector */
        .model-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .segmented {
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 2px;
            gap: 2px;
            flex: 1;
        }

        [data-theme="light"] .segmented { background: rgba(0, 0, 0, 0.04); }

        .seg-btn {
            flex: 1;
            padding: 6px 0;
            border: none;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text-secondary);
            background: transparent;
        }

        .seg-btn:hover { color: var(--text); }

        .seg-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }

        .think-btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text-secondary);
            background: transparent;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .think-btn:hover { border-color: var(--border-strong); color: var(--text); }
        .think-btn:active { transform: scale(0.96); }
        .think-btn svg { width: 14px; height: 14px; }

        .think-btn.active {
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
            color: white;
            border-color: transparent;
            box-shadow: 0 2px 10px rgba(139, 92, 246, 0.3);
            animation: thinkPulse 2.5s ease-in-out infinite;
        }

        @keyframes thinkPulse {
            0%, 100% { box-shadow: 0 2px 10px rgba(139, 92, 246, 0.3); }
            50% { box-shadow: 0 2px 20px rgba(139, 92, 246, 0.5); }
        }

        /* Preset Editor */
        .preset-editor {
            background: rgba(99, 102, 241, 0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 10px;
            animation: editorIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 300px;
            overflow-y: auto;
        }

        .preset-editor.visible { display: flex; }

        @keyframes editorIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 1;
            padding-bottom: 6px;
        }

        .editor-title {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text);
        }

        .editor-close {
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-tertiary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all var(--transition);
        }

        .editor-close:hover { background: var(--surface-hover); color: var(--text); }

        .editor-fields {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .editor-row {
            display: flex;
            gap: 6px;
        }

        .editor-row > * { flex: 1; }

        .editor-field {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .editor-field.full { flex: 1; }

        .editor-hint {
            font-size: 0.62rem;
            color: var(--text-tertiary);
            line-height: 1.5;
            padding: 6px 8px;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 6px;
            border-left: 2px solid var(--primary-dim);
        }

        .editor-field input {
            padding: 7px 10px;
            border: 1.5px solid var(--border);
            border-radius: 7px;
            font-size: 0.78rem;
            background: var(--bg);
            outline: none;
            transition: all var(--transition);
            font-family: 'Fira Code', monospace;
            color: var(--text);
            width: 100%;
            min-width: 0;
        }

        .editor-field input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.08);
        }

        .editor-field input[type="color"] {
            height: 34px;
            padding: 4px 6px;
            cursor: pointer;
        }

        .editor-field select {
            padding: 7px 10px;
            border: 1.5px solid var(--border);
            border-radius: 7px;
            font-size: 0.78rem;
            background: var(--bg);
            outline: none;
            font-family: inherit;
            color: var(--text);
            cursor: pointer;
        }

        .editor-actions {
            display: flex;
            gap: 6px;
            position: sticky;
            bottom: 0;
            background: var(--surface);
            padding-top: 6px;
        }

        .editor-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            border-radius: 8px;
            font-size: 0.76rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
        }

        .editor-btn.primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }

        .editor-btn.primary:hover { box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4); transform: translateY(-1px); }
        .editor-btn.primary:active { transform: scale(0.97); }

        .editor-btn.cancel {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .editor-btn.cancel:hover { border-color: var(--border-strong); color: var(--text); }

        /* Preset Card */
        .preset-card canvas { display: block; }
        .preset-label { display: block; }

        /* Function List */
        .func-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 28px;
        }

        .func-empty {
            font-size: 0.75rem;
            color: var(--text-tertiary);
        }

        .func-badge {
            background: var(--primary-dim);
            border: 1px solid var(--border);
            padding: 4px 8px 4px 6px;
            border-radius: 8px;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
            cursor: default;
            transition: all var(--transition);
        }

        .func-badge:hover {
            border-color: var(--border-strong);
        }

        .color-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .func-badge .del-btn {
            background: none;
            border: none;
            padding: 0 1px;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-tertiary);
            line-height: 1;
            transition: all var(--transition);
            border-radius: 4px;
        }

        .func-badge .del-btn:hover {
            color: var(--danger);
            background: var(--danger-dim);
        }

        /* Thinking Box */
        .thinking-box {
            background: rgba(139, 92, 246, 0.06);
            border: 1px solid rgba(139, 92, 246, 0.12);
            border-radius: var(--radius);
            padding: 10px 12px;
            font-size: 0.72rem;
            color: var(--text-secondary);
            max-height: 0;
            overflow: hidden;
            white-space: pre-wrap;
            font-family: 'Fira Code', monospace;
            line-height: 1.6;
            transition: all 0.3s;
            opacity: 0;
        }

        .thinking-box.visible {
            max-height: 160px;
            overflow-y: auto;
            opacity: 1;
        }

        .thinking-box .reasoning-section {
            color: #8b5cf6;
            border-left: 2px solid #8b5cf6;
            padding-left: 10px;
            margin-bottom: 8px;
            font-style: italic;
        }

        .thinking-box .content-section { color: var(--text); }

        .thinking-box .section-label {
            font-weight: 600;
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
            font-style: normal;
            color: var(--text-tertiary);
        }

        /* Sidebar Footer */
        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-row input {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.82rem;
            background: var(--bg);
            outline: none;
            transition: all var(--transition);
            font-family: inherit;
            color: var(--text);
        }

        .input-row input::placeholder { color: var(--text-tertiary); }

        .input-row input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .send-btn {
            padding: 0 18px;
            border: none;
            border-radius: var(--radius);
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 0.82rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .send-btn:hover {
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
            transform: translateY(-1px);
        }

        .send-btn:active { transform: scale(0.97); }
        .send-btn svg { width: 15px; height: 15px; }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            flex-shrink: 0;
        }

        .status-dot.thinking {
            background: var(--primary);
            animation: statusPulse 1.2s ease-in-out infinite;
        }

        .status-dot.error { background: var(--danger); }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .status-text {
            font-size: 0.72rem;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        /* ========= Toast ========= */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 10px 18px;
            font-size: 0.8rem;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: toastIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) both;
            backdrop-filter: blur(20px);
            pointer-events: auto;
        }

        .toast.leaving { animation: toastOut 0.3s cubic-bezier(0.4, 0, 0.2, 1) both; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-12px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-12px) scale(0.95); }
        }

        .toast-icon { width: 16px; height: 16px; flex-shrink: 0; }

            // ========= Slider Core =========
            function evaluateExpr(expr, context) {
                const keys = Object.keys(context);
                const vals = Object.values(context);
                try {
                    return new Function(...keys, '"use strict"; return (' + expr + ');')(...vals);
                } catch (e) {
                    return NaN;
                }
            }

            function getSliderParams() {
                const ctx = {};
                for (let s of sliders) ctx[s.name] = s.value;

            function addSlider(name, min, max, step, value) {
                if (sliders.find(s => s.name === name)) {
                    showToast('滑动条 "' + name + '" 已存在', 'error');
                    return;
                }
                sliders.push({ name, min, max, step: step || 0.1, value: value !== undefined ? value : min, playing: false, speed: 1 });
                renderSliders();
                redraw();
            }

            function removeSlider(name) {
                sliders = sliders.filter(s => s.name !== name);
                if (sliders.length === 0) stopAllAnimations();
                renderSliders();
                redraw();
            }

            function stopAllAnimations() {
                for (let s of sliders) s.playing = false;
                animationRunning = false;

            function renderSliders() {
                const container = document.getElementById('sliderList');

                                    : '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>'}
                            </button>
                            <button class="slider-speed-btn" data-action="speed" data-slider="${s.name}" title="速度: ${s.speed}x">×${s.speed}</button>
                            <button class="slider-delete-btn" data-action="delete" data-slider="${s.name}" title="删除滑动条">&times;</button>
                        </div>
                    </div>`;

                container.innerHTML = html;

                for (let card of container.querySelectorAll('.slider-card')) {
                    const track = card.querySelector('.slider-track');

                        track.addEventListener('input', function() {

                            const sObj = sliders.find(s => s.name === sName);
                            if (sObj) {
                                sObj.value = parseFloat(this.value);
                                card.querySelector('.slider-value-display').textContent = sObj.value.toFixed(3);
                            }
                            redraw();
                        });
                    }
                    const btns = card.querySelectorAll('button');
                    for (let btn of btns) {
                        btn.addEventListener('click', function() {
                            const sName = this.getAttribute('data-slider');
                            const action = this.getAttribute('data-action');
                            const sObj = sliders.find(s => s.name === sName);
                            if (!sObj) return;
                            if (action === 'play') {
                                sObj.playing = !sObj.playing;
                                if (!sObj.playing) sObj.direction = 1;
                                if (sliders.some(s => s.playing)) startAnimationLoop();
                                else animationRunning = false;
                            } else if (action === 'speed') {
                                const speeds = [0.5, 1, 2, 4];
                                const idx = speeds.indexOf(sObj.speed);
                                sObj.speed = speeds[(idx + 1) % speeds.length];
                                this.textContent = '×' + sObj.speed;
                            } else if (action === 'delete') {
                                removeSlider(sName);
                            }
                        });
                    }

            let lastAnimTime = 0;
            function startAnimationLoop() {
                if (animationRunning) return;
                animationRunning = true;
                lastAnimTime = performance.now();
                function animate(time) {
                    if (!animationRunning) return;
                    const dt = Math.min((time - lastAnimTime) / 1000, 0.1);
                    lastAnimTime = time;
                    let anyPlaying = false;
                    for (let s of sliders) {
                        if (!s.playing) continue;
                        anyPlaying = true;
                        const range = s.max - s.min;
                        const delta = (range / 5) * dt * s.speed;
                        s.value += delta * s.direction;
                        if (s.value >= s.max) {
                            s.value = s.max;
                            s.direction = -1;
                        } else if (s.value <= s.min) {
                            s.value = s.min;
                            s.direction = 1;
                        }
                        s.value = Math.round(s.value / s.step) * s.step;
                        s.value = Math.min(Math.max(s.value, s.min), s.max);
                    }
                    if (anyPlaying) {
                        renderSliders();
                        redraw();
                        requestAnimationFrame(animate);
                    } else {
                        animationRunning = false;
                        renderSliders();
                        redraw();
                    }
                }
                requestAnimationFrame(animate);
            }

            function insertKey(key) {
                const input = document.getElementById('userInput');
                if (!input) return;
                if (key === '⌫') {
                    input.value = input.value.slice(0, -1);
                } else if (key === '| |') {
                    const s = input.selectionStart || input.value.length;
                    input.value = input.value.slice(0, s) + '|x|' + input.value.slice(s);
                    input.selectionStart = input.selectionEnd = s + 3;
                } else if (key === 'x²') {
                    const s = input.selectionStart || input.value.length;
                    input.value = input.value.slice(0, s) + '^2' + input.value.slice(s);
                    input.selectionStart = input.selectionEnd = s + 2;
                } else if (key === '±') {
                    const s = input.selectionStart || input.value.length;
                    input.value = input.value.slice(0, s) + '±' + input.value.slice(s);
                    input.selectionStart = input.selectionEnd = s + 1;
                } else {
                    const s = input.selectionStart !== null ? input.selectionStart : input.value.length;
                    input.value = input.value.slice(0, s) + key + input.value.slice(s);
                    input.selectionStart = input.selectionEnd = s + key.length;
                }
                input.focus();
            }

            function drawParamPoint(g, alpha) {
                const params = getSliderParams();
                let x = evaluateExpr(g.xExpr, params);
                let y = evaluateExpr(g.yExpr, params);
                if (!isFinite(x) || !isFinite(y) || isNaN(x) || isNaN(y)) return;
                const { px, py } = worldToPixel(x, y);
                if (px < -20 || px > LOGICAL_W + 20 || py < -20 || py > LOGICAL_H + 20) return;

                // Trail
                if (g.trail) {
                    g._trail = g._trail || [];
                    if (g._trail.length === 0 || Math.hypot(x - g._trail[g._trail.length - 1].x, y - g._trail[g._trail.length - 1].y) > 0.02) {
                        g._trail.push({ x, y });
                    }
                    const maxTrail = 300;
                    while (g._trail.length > maxTrail) g._trail.shift();
                    if (g._trail.length > 1) {
                        ctx.beginPath();
                        ctx.strokeStyle = g.color;
                        ctx.lineWidth = g.lineWidth ? g.lineWidth * 0.6 : 1.5;
                        ctx.globalAlpha = alpha * 0.6;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        const first = worldToPixel(g._trail[0].x, g._trail[0].y);
                        ctx.moveTo(first.px, first.py);
                        for (let i = 1; i < g._trail.length; i++) {
                            const tp = worldToPixel(g._trail[i].x, g._trail[i].y);
                            ctx.lineTo(tp.px, tp.py);
                        }
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                }

                ctx.beginPath();
                ctx.globalAlpha = alpha;
                const glowRadius = g.size / 2 + 4;
                const glow = ctx.createRadialGradient(px, py, 0, px, py, glowRadius);
                glow.addColorStop(0, g.color);
                glow.addColorStop(1, 'transparent');
                ctx.fillStyle = glow;
                ctx.arc(px, py, glowRadius, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = g.color;
                ctx.arc(px, py, g.size / 2, 0, 2 * Math.PI);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.globalAlpha = 1;

                if (g.label) {
                    ctx.save();
                    const fontSize = 13;
                    ctx.font = `600 ${fontSize}px Outfit, -apple-system, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    const labelText = g.labelExpr ? g.label.replace(/\{val\}/g, params[Object.keys(params)[0]]?.toFixed(2) || '') : g.label;
                    const textWidth = ctx.measureText(labelText).width;
                    const dark = isDark();
                    ctx.fillStyle = dark ? 'rgba(12,12,24,0.85)' : 'rgba(255,255,255,0.85)';
                    const lx = px, ly = py - g.size / 2 - 6;
                    ctx.beginPath();
                    ctx.ellipse(lx, ly - 2, textWidth / 2 + 6, fontSize / 2 + 3, 0, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = g.color;
                    ctx.fillText(labelText, lx, ly);
                    ctx.restore();
                }
            }

            function drawParamCurve(g, alpha) {
                const params = getSliderParams();
                const tMin = g.tMin !== undefined ? g.tMin : 0;
                const tMax = g.tMax !== undefined ? g.tMax : 1;
                const steps = 500;
                ctx.beginPath();
                ctx.strokeStyle = g.color;
                ctx.lineWidth = g.lineWidth || 2;
                ctx.globalAlpha = alpha;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                const context = { ...params, t: undefined };
                let first = true;
                for (let i = 0; i <= steps; i++) {
                    context.t = tMin + (i / steps) * (tMax - tMin);
                    let x = evaluateExpr(g.xExpr, context);
                    let y = evaluateExpr(g.yExpr, context);
                    if (!isFinite(x) || !isFinite(y) || isNaN(x) || isNaN(y)) { first = true; continue; }
                    const { px, py } = worldToPixel(x, y);
                    if (px < -50 || px > LOGICAL_W + 50 || py < -50 || py > LOGICAL_H + 50) { first = true; continue; }
                    if (first) { ctx.moveTo(px, py); first = false; }
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
                ctx.globalAlpha = 1;
            }

            function buildToolbar() {

            function handleToolClick(toolId) {
                const tool = TOOLS.find(t => t.id === toolId);
                if (!tool) return;
                if (tool.dynamic) {
                    const def = DYNAMIC_DEFS[tool.type];
                    if (def) applyDynamicDef(def);
                } else if (tool.type === 'points') {
                    namedPoints.push({ label: getNextPointLabel(), x: 1, y: 2, color: tool.color || '#10b981' });
                    renderPoints();
                    const g = createGraphicFromSpec({ type: 'points', points: [[1, 2]], color: tool.color, size: 8 });
                    if (g) { addGraphic(g, true); redraw(); }
                    showToast('已添加点 ' + namedPoints[namedPoints.length - 1].label, 'success');
                } else {
                    const spec = buildSpecFromTool(tool);

                }

            let nextPointIndex = 0;
            function getNextPointLabel() {
                const used = new Set(namedPoints.map(p => p.label));
                const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                for (let i = 0; i < 26; i++) { if (!used.has(letters[i])) return letters[i]; }
                return 'P' + (++nextPointIndex);
            }

            function buildSpecFromTool(tool) {
                const t = tool.type;
                if (t === 'rect') return { type: 'rectangle', x: tool.x, y: tool.y, w: tool.w, h: tool.h, color: tool.color, lineWidth: tool.lineWidth, fill: tool.fill };
                if (t === 'tri') return { type: 'polygon', points: tool.points, color: tool.color, lineWidth: tool.lineWidth, fill: tool.fill };
                if (t === 'ellipse') return { type: 'ellipse', cx: tool.params.cx, cy: tool.params.cy, rx: tool.params.rx, ry: tool.params.ry, color: tool.color, lineWidth: tool.lineWidth, fill: tool.fill };
                if (t === 'circle') return { type: 'circle', params: tool.params, color: tool.color, lineWidth: tool.lineWidth, fill: tool.fill };
                if (t === 'segment' || t === 'ray') return { type: t, points: tool.points, color: tool.color, lineWidth: tool.lineWidth };
                if (t === 'points') return { type: 'points', points: tool.points, color: tool.color, size: tool.size || 8 };
                return { type: t, params: tool.params, color: tool.color, lineWidth: tool.lineWidth };
            }

            function applyDynamicDef(def) {
                stopAllAnimations();
                const sDef = def.slider;
                const existing = sliders.find(s => s.name === sDef.name);
                if (existing) {
                    existing.min = sDef.min; existing.max = sDef.max; existing.step = sDef.step;
                    existing.value = sDef.value; existing.playing = false;
                } else {
                    sliders.push({ name: sDef.name, min: sDef.min, max: sDef.max, step: sDef.step, value: sDef.value, playing: false, speed: 1, direction: 1 });
                }
                namedPoints = [];
                for (let gSpec of def.graphics) {
                    if (gSpec.type === 'namedPoint') {
                        if (!namedPoints.find(p => p.label === gSpec.label)) {
                            namedPoints.push({ label: gSpec.label, x: gSpec.x, y: gSpec.y, color: gSpec.color || '#6366f1' });
                            const ptG = createGraphicFromSpec({ type: 'points', points: [[gSpec.x, gSpec.y]], color: gSpec.color, size: 7 });
                            if (ptG) { addGraphic(ptG, true); }
                        }
                    } else {
                        addGraphic(gSpec, true);
                    }
                }
                renderPoints();
                renderSliders();
                redraw();
                showToast('已加载: ' + def.label, 'success');
            }

            // ========= Named Points & Connection =========
            function renderPoints() {
                const container = document.getElementById('pointList');
                if (!container) return;
                if (namedPoints.length === 0) {
                    container.innerHTML = '<span class="func-empty">点击工具添加点</span>';
                    return;
                }
                let html = '';
                const params = getSliderParams();
                for (let p of namedPoints) {
                    const sel = selectedPoints.includes(p) ? ' selected' : '';
                    const cls = 'point-badge' + sel;
                    html += `<span class="${cls}" data-label="${p.label}" title="(${p.x.toFixed(2)}, ${p.y.toFixed(2)})">${p.label}</span>`;
                }
                container.innerHTML = html;
                container.querySelectorAll('.point-badge').forEach(badge => {
                    badge.addEventListener('click', function() { selectPoint(this.getAttribute('data-label')); });
                });
            }

            function selectPoint(label) {
                const pt = namedPoints.find(p => p.label === label);
                if (!pt) return;
                if (selectedPoints.includes(pt)) {
                    selectedPoints = selectedPoints.filter(p => p !== pt);
                } else {
                    selectedPoints.push(pt);
                    if (selectedPoints.length > 2) selectedPoints.shift();
                }
                renderPoints();
            }

            function connectPoints(connType) {
                if (selectedPoints.length < 2) {
                    showToast('请先选中2个点', 'error');
                    return;
                }
                const p1 = selectedPoints[0];
                const p2 = selectedPoints[1];
                const isDyn1 = isDynamicPoint(p1);
                const isDyn2 = isDynamicPoint(p2);

                if (connType === 'segment' || connType === 'ray') {
                    if (isDyn1 || isDyn2) {
                        const xExpr1 = isDyn1 ? getPointExpr(p1) : p1.x.toString();
                        const yExpr1 = isDyn1 ? getPointExpr(p1, false) : p1.y.toString();
                        const xExpr2 = isDyn2 ? getPointExpr(p2) : p2.x.toString();
                        const yExpr2 = isDyn2 ? getPointExpr(p2, false) : p2.y.toString();
                        const color = connType === 'ray' ? '#ef4444' : '#f59e0b';
                        const g = createGraphicFromSpec({
                            type: 'paramConn',
                            xExpr1, yExpr1, xExpr2, yExpr2,
                            color, lineWidth: 2, connType: connType
                        });
                        if (g) { addGraphic(g, true); redraw(); }
                    } else {
                        const color = connType === 'ray' ? '#ef4444' : '#f59e0b';
                        const g = createGraphicFromSpec({
                            type: connType, points: [[p1.x, p1.y], [p2.x, p2.y]], color, lineWidth: 2
                        });
                        if (g) { addGraphic(g, true); redraw(); }
                    }
                } else if (connType === 'line') {
                    if (isDyn1 || isDyn2) {
                        const xExpr1 = isDyn1 ? getPointExpr(p1) : p1.x.toString();
                        const yExpr1 = isDyn1 ? getPointExpr(p1, false) : p1.y.toString();
                        const xExpr2 = isDyn2 ? getPointExpr(p2) : p2.x.toString();
                        const yExpr2 = isDyn2 ? getPointExpr(p2, false) : p2.y.toString();
                        const g = createGraphicFromSpec({
                            type: 'paramConn', xExpr1, yExpr1, xExpr2, yExpr2,
                            color: '#6366f1', lineWidth: 2, connType: 'line'
                        });
                        if (g) { addGraphic(g, true); redraw(); }
                    } else {
                        const k = (p2.y - p1.y) / (p2.x - p1.x);
                        const b = p1.y - k * p1.x;
                        const g = createGraphicFromSpec({
                            type: 'line', params: { k: isFinite(k) ? k : 0, b: isFinite(b) ? b : 0 },
                            color: '#6366f1', lineWidth: 2
                        });
                        if (g) { addGraphic(g, true); redraw(); }
                    }
                }
                const names = connType === 'segment' ? '线段' : connType === 'line' ? '直线' : '射线';
                showToast(`已连接: ${p1.label}→${p2.label} (${names})`, 'success');
            }

            function isDynamicPoint(pt) {
                return pt.isDynamic === true;
            }

            function getPointExpr(pt, isX) {
                if (pt.exprX && pt.exprY) return isX !== false ? pt.exprX : pt.exprY;
                return isX !== false ? pt.x.toString() : pt.y.toString();
            }

            // ========= Toast =========
            function showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast';
                const iconSvg = type === 'success'
                    ? '<svg class="toast-icon success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
                    : type === 'error'
                    ? '<svg class="toast-icon error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
                    : '<svg class="toast-icon info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
                toast.innerHTML = iconSvg + '<span>' + message + '</span>';
                container.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add('leaving');
                    setTimeout(() => toast.remove(), 300);
                }, 2500);
            }

            // ========= Theme =========
            function loadTheme() {
                const saved = localStorage.getItem(THEME_KEY);
                if (saved === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    updateThemeIcon(false);
                } else {
                    updateThemeIcon(true);
                }
            }

            function toggleTheme() {
                const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
                if (isDark) {
                    document.documentElement.setAttribute('data-theme', 'light');
                    localStorage.setItem(THEME_KEY, 'light');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem(THEME_KEY, 'dark');
                }
                updateThemeIcon(!isDark);
                redraw();
            }

            function updateThemeIcon(isDark) {
                const btn = document.getElementById('themeToggle');
                if (isDark) {
                    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>';
