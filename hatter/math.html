                    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
                }
            }

            // ========= Canvas Empty Hint =========
            function updateEmptyHint() {
                const hint = document.getElementById('canvasEmptyHint');
                if (!hint) return;
                graphics.length > 0 ? hint.classList.add('hidden') : hint.classList.remove('hidden');
            }

            // ========= Settings =========
            function loadSettings() {
                const savedModel = localStorage.getItem(MODEL_KEY);
                if (savedModel === 'deepseek-v4-pro' || savedModel === 'deepseek-v4-flash') currentModel = savedModel;
                const savedThink = localStorage.getItem(DEEPTHINK_KEY);
                if (savedThink === 'true') deepThinkEnabled = true;
                else if (savedThink === 'false') deepThinkEnabled = false;
                updateModelButtons();
                updateDeepThinkButton();
            }

            function saveModelSetting() { localStorage.setItem(MODEL_KEY, currentModel); }
            function saveDeepThinkSetting() { localStorage.setItem(DEEPTHINK_KEY, deepThinkEnabled ? 'true' : 'false'); }

            function updateModelButtons() {
                const btnFlash = document.getElementById('btnFlash');
                const btnPro = document.getElementById('btnPro');
                if (currentModel === 'deepseek-v4-pro') {
                    btnFlash.classList.remove('active');
                    btnPro.classList.add('active');
                } else {
                    btnFlash.classList.add('active');
                    btnPro.classList.remove('active');
                }
            }

            function updateDeepThinkButton() {
                const btn = document.getElementById('btnDeepThink');
                deepThinkEnabled ? btn.classList.add('active') : btn.classList.remove('active');
            }

            // ========= Status =========
            function setStatus(text, type = 'idle') {
                document.getElementById("statusMsg").innerText = text;
                document.getElementById("statusDot").className = 'status-dot' + (type !== 'idle' ? ' ' + type : '');
            }

            // ========= Coordinate Conversion =========
            function updateZoomDisplay() {
                let zoom = 12.0 / (xMax - xMin);
                document.getElementById("zoomLevel").innerText = zoom.toFixed(1);
            }

            function worldToPixel(xWorld, yWorld) {
                return {
                    px: (xWorld - xMin) / (xMax - xMin) * LOGICAL_W,
                    py: LOGICAL_H - (yWorld - yMin) / (yMax - yMin) * LOGICAL_H
                };
            }

            function pixelToWorld(px, py) {
                return {
                    x: xMin + (px / LOGICAL_W) * (xMax - xMin),
                    y: yMin + ((LOGICAL_H - py) / LOGICAL_H) * (yMax - yMin)
                };
            }

            function getAdaptiveStep() {
                let rangeX = xMax - xMin;
                if (rangeX > 24) return 4.0;
                if (rangeX > 12) return 2.0;
                if (rangeX < 3) return 0.5;
                if (rangeX < 1.5) return 0.2;
                return 1.0;
            }

            // ========= Drawing Core =========
            function isDark() { return document.documentElement.getAttribute('data-theme') !== 'light'; }

            function setDash(style) {
                if (style && Array.isArray(style)) ctx.setLineDash(style);
                else ctx.setLineDash([]);
            }

            function drawGridAndAxes() {
                const dark = isDark();
                ctx.save();
                ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
                ctx.fillStyle = dark ? '#0c0c18' : '#ffffff';
                ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
                let step = getAdaptiveStep();
                let startX = Math.ceil(xMin / step) * step;
                let startY = Math.ceil(yMin / step) * step;

                // Grid
                ctx.beginPath();
                ctx.strokeStyle = dark ? "rgba(255,255,255,0.04)" : "#f0f0f5";
                ctx.lineWidth = 1;
                for (let x = startX; x <= xMax; x += step) {
                    let { px } = worldToPixel(x, 0);
                    if (px >= 0 && px <= LOGICAL_W) { ctx.moveTo(px, 0); ctx.lineTo(px, LOGICAL_H); }
                }
                for (let y = startY; y <= yMax; y += step) {
                    let { py } = worldToPixel(0, y);
                    if (py >= 0 && py <= LOGICAL_H) { ctx.moveTo(0, py); ctx.lineTo(LOGICAL_H, py); }
                }
                ctx.stroke();

                // Axes
                let { px: ox, py: oy } = worldToPixel(0, 0);
                ctx.beginPath();
                ctx.strokeStyle = dark ? "rgba(255,255,255,0.15)" : "#d1d1d6";
                ctx.lineWidth = 1.5;
                ctx.moveTo(0, oy); ctx.lineTo(LOGICAL_W, oy); ctx.stroke();
                ctx.moveTo(ox, 0); ctx.lineTo(ox, LOGICAL_H); ctx.stroke();

                // Origin
                ctx.beginPath();
                ctx.fillStyle = dark ? "rgba(255,255,255,0.3)" : "#8e8e93";
                ctx.arc(ox, oy, 3, 0, 2 * Math.PI);
                ctx.fill();

                // Labels
                ctx.fillStyle = dark ? "rgba(255,255,255,0.25)" : "rgba(0,0,0,0.18)";
                ctx.font = '500 11px Outfit, -apple-system, sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                for (let x = startX; x <= xMax; x += step) {
                    if (Math.abs(x) < 0.001) continue;
                    let { px } = worldToPixel(x, 0);
                    if (px > 20 && px < LOGICAL_W - 20) {
                        ctx.fillText(formatNum(x), px, Math.min(Math.max(oy + 6, 6), LOGICAL_H - 16));
                    }
                }
                ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                for (let y = startY; y <= yMax; y += step) {
                    if (Math.abs(y) < 0.001) continue;
                    let { py } = worldToPixel(0, y);
                    if (py > 20 && py < LOGICAL_H - 20) {
                        ctx.fillText(formatNum(y), Math.min(Math.max(ox - 6, 30), LOGICAL_W - 6), py);
                    }
                }
                ctx.restore();
            }

            function formatNum(n) {
                if (Number.isInteger(n)) return n.toString();
                return n.toFixed(1).replace(/\.0$/, '');
            }

            function drawSegment(p1, p2, color, lineWidth = 2.5, dash = null, alpha = 1, isHovered = false) {
                let { px: x1, py: y1 } = worldToPixel(p1[0], p1[1]);
                let { px: x2, py: y2 } = worldToPixel(p2[0], p2[1]);
                ctx.beginPath();
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = isHovered ? "#f59e0b" : color;
                ctx.lineWidth = isHovered ? lineWidth + 1.5 : lineWidth;
                ctx.lineCap = 'round';
                setDash(dash);
                ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
                ctx.stroke(); setDash(null); ctx.globalAlpha = 1;
            }

            function drawPolygon(points, color, lineWidth = 2.5, dash = null, fill = false, fillColor = null, alpha = 1, isHovered = false) {
                if (points.length < 2) return;
                ctx.beginPath();
                let first = worldToPixel(points[0][0], points[0][1]);
                ctx.moveTo(first.px, first.py);
                for (let i = 1; i < points.length; i++) {
                    let p = worldToPixel(points[i][0], points[i][1]);
                    ctx.lineTo(p.px, p.py);
                }
                ctx.closePath();
                ctx.globalAlpha = alpha;
                if (fill && fillColor) { ctx.fillStyle = fillColor; ctx.fill(); }
                ctx.strokeStyle = isHovered ? "#f59e0b" : color;
                ctx.lineWidth = isHovered ? lineWidth + 1.5 : lineWidth;
                ctx.lineJoin = 'round'; setDash(dash); ctx.stroke(); setDash(null); ctx.globalAlpha = 1;
            }

            function drawRectangle(x, y, w, h, color, lineWidth = 2.5, dash = null, fill = false, fillColor = null, alpha = 1, isHovered = false) {
                let p1 = worldToPixel(x, y), p2 = worldToPixel(x + w, y + h);
                ctx.beginPath(); ctx.rect(p1.px, p1.py, p2.px - p1.px, p2.py - p1.py);
                ctx.globalAlpha = alpha;
                if (fill && fillColor) { ctx.fillStyle = fillColor; ctx.fill(); }
                ctx.strokeStyle = isHovered ? "#f59e0b" : color;
                ctx.lineWidth = isHovered ? lineWidth + 1.5 : lineWidth;
                setDash(dash); ctx.stroke(); setDash(null); ctx.globalAlpha = 1;
            }

            function drawEllipse(cx, cy, rx, ry, color, lineWidth = 2.5, dash = null, fill = false, fillColor = null, alpha = 1, isHovered = false) {
                let center = worldToPixel(cx, cy);
                let radiusX = (rx / (xMax - xMin)) * LOGICAL_W;
                let radiusY = (ry / (yMax - yMin)) * LOGICAL_H;
                ctx.beginPath();
                ctx.ellipse(center.px, center.py, Math.max(radiusX, 0.1), Math.max(radiusY, 0.1), 0, 0, 2 * Math.PI);
                ctx.globalAlpha = alpha;
                if (fill && fillColor) { ctx.fillStyle = fillColor; ctx.fill(); }
                ctx.strokeStyle = isHovered ? "#f59e0b" : color;
                ctx.lineWidth = isHovered ? lineWidth + 1.5 : lineWidth;
                setDash(dash); ctx.stroke(); setDash(null); ctx.globalAlpha = 1;
            }

            function drawPoints(points, color, size = 6, alpha = 1, isHovered = false) {
                for (let p of points) {
                    let { px, py } = worldToPixel(p[0], p[1]);
                    ctx.beginPath(); ctx.globalAlpha = alpha;
                    if (!isHovered) {
                        ctx.fillStyle = 'rgba(255,255,255,0.6)';
                        ctx.arc(px, py, size / 2 + 2, 0, 2 * Math.PI); ctx.fill();
                    }
                    ctx.fillStyle = isHovered ? "#f59e0b" : color;
                    ctx.arc(px, py, size / 2, 0, 2 * Math.PI); ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            function drawFunctionCurve(fn, alpha = 1, isHovered = false) {
                if (fn.type === "circle") {
                    let { cx, cy, r } = fn.params;
                    drawEllipse(cx, cy, r, r, fn.color, fn.lineWidth || 2.5, fn.strokeDash, fn.fill, fn.fillColor, alpha, isHovered);
                    return;
                }
                if (fn.type === "line") {
                    if (fn.isVertical) {
                        let x = fn.params.x;
                        let { px } = worldToPixel(x, 0);
                        if (px >= 0 && px <= LOGICAL_W) {
                            ctx.beginPath(); ctx.globalAlpha = alpha;
                            ctx.strokeStyle = isHovered ? "#f59e0b" : fn.color;
                            ctx.lineWidth = isHovered ? (fn.lineWidth || 2.5) + 1.5 : (fn.lineWidth || 2.5);
                            setDash(fn.strokeDash); ctx.moveTo(px, 0); ctx.lineTo(px, LOGICAL_H);
                            ctx.stroke(); setDash(null); ctx.globalAlpha = 1;
                        }
                        return;
                    }
                    let { k, b } = fn.params;
                    let p1 = worldToPixel(xMin, k * xMin + b), p2 = worldToPixel(xMax, k * xMax + b);
                    ctx.beginPath(); ctx.globalAlpha = alpha;
                    ctx.strokeStyle = isHovered ? "#f59e0b" : fn.color;
                    ctx.lineWidth = isHovered ? (fn.lineWidth || 2.5) + 1.5 : (fn.lineWidth || 2.5);
                    ctx.lineCap = 'round'; setDash(fn.strokeDash);
                    ctx.moveTo(p1.px, p1.py); ctx.lineTo(p2.px, p2.py);
                    ctx.stroke(); setDash(null); ctx.globalAlpha = 1;
                    return;
                }
                if (fn.type === "ray") {
                    let p1 = worldToPixel(fn.points[0][0], fn.points[0][1]), p2 = worldToPixel(fn.points[1][0], fn.points[1][1]);
                    let dx = p2.px - p1.px, dy = p2.py - p1.py, dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 0) { dx /= dist; dy /= dist; }
                    let endPx = p1.px + dx * 3000, endPy = p1.py + dy * 3000;
                    ctx.beginPath(); ctx.globalAlpha = alpha;
                    ctx.strokeStyle = isHovered ? "#f59e0b" : fn.color;
                    ctx.lineWidth = isHovered ? (fn.lineWidth || 2.5) + 1.5 : (fn.lineWidth || 2.5);
                    ctx.lineCap = 'round'; setDash(fn.strokeDash);
                    ctx.moveTo(p1.px, p1.py); ctx.lineTo(endPx, endPy);
                    ctx.stroke(); setDash(null); ctx.globalAlpha = 1;
                    return;
                }
                if (fn.type === "paramConn") {
                    const params = getSliderParams();
                    let x1 = evaluateExpr(fn.xExpr1, params), y1 = evaluateExpr(fn.yExpr1, params);
                    let x2 = evaluateExpr(fn.xExpr2, params), y2 = evaluateExpr(fn.yExpr2, params);
                    if (!isFinite(x1) || !isFinite(y1) || !isFinite(x2) || !isFinite(y2)) return;
                    let p1 = worldToPixel(x1, y1), p2 = worldToPixel(x2, y2);
                    if (fn.connType === 'ray') {
                        let dx = p2.px - p1.px, dy = p2.py - p1.py, dist = Math.sqrt(dx*dx+dy*dy);
                        if (dist > 0) { dx /= dist; dy /= dist; }
                        p2 = { px: p1.px + dx * 3000, py: p1.py + dy * 3000 };
                    } else if (fn.connType === 'line') {
                        let dx = p2.px - p1.px, dy = p2.py - p1.py, dist = Math.sqrt(dx*dx+dy*dy);
                        if (dist > 0) { dx /= dist; dy /= dist; }
                        p2 = { px: p1.px + dx * 3000, py: p1.py + dy * 3000 };
                        p1 = { px: p1.px - dx * 3000, py: p1.py - dy * 3000 };
                    }
                    ctx.beginPath(); ctx.globalAlpha = alpha;
                    ctx.strokeStyle = fn.color; ctx.lineWidth = fn.lineWidth || 2;
                    ctx.lineCap = 'round'; setDash(fn.strokeDash);
                    ctx.moveTo(p1.px, p1.py); ctx.lineTo(p2.px, p2.py);
                    ctx.stroke(); setDash(null); ctx.globalAlpha = 1;
                    return;
                }
                ctx.beginPath(); ctx.globalAlpha = alpha;
                ctx.strokeStyle = isHovered ? "#f59e0b" : fn.color;
                ctx.lineWidth = isHovered ? (fn.lineWidth || 2.5) + 1.5 : (fn.lineWidth || 2.5);
                ctx.lineCap = 'round'; ctx.lineJoin = 'round'; setDash(fn.strokeDash);
                let first = true, steps = 1000;
                for (let i = 0; i <= steps; i++) {
                    let x = xMin + (i / steps) * (xMax - xMin);
                    let y = fn.getY(x);
                    if (y === undefined || !isFinite(y) || isNaN(y)) { first = true; continue; }
                    let { px, py } = worldToPixel(x, y);
                    if (px < 0 || px > LOGICAL_W || py < 0 || py > LOGICAL_H) { first = true; continue; }
                    if (first) { ctx.moveTo(px, py); first = false; } else { ctx.lineTo(px, py); }
                }
                ctx.stroke(); setDash(null); ctx.globalAlpha = 1;
            }

            function drawAnnotations(alpha = 1) {
                for (let ann of graphics.filter(g => g.type === "text")) {
                    let { px, py } = worldToPixel(ann.x, ann.y);
                    ctx.save();
                    let fontSize = ann.fontSize || 16;
                    ctx.font = `600 ${fontSize}px Outfit, -apple-system, sans-serif`;
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    let textWidth = ctx.measureText(ann.text).width;
                    let padding = 8, dark = isDark();
                    ctx.fillStyle = dark ? "rgba(12,12,24,0.92)" : "rgba(255,255,255,0.92)";
                    ctx.beginPath();
                    ctx.ellipse(px, py, textWidth / 2 + padding, fontSize / 2 + padding - 2, 0, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.strokeStyle = dark ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.06)";
                    ctx.lineWidth = 1; ctx.stroke();
                    ctx.fillStyle = ann.color || (dark ? "#e0e0f0" : "#1d1d1f");
                    ctx.globalAlpha = alpha; ctx.fillText(ann.text, px, py);
                    ctx.restore();
                }
                ctx.globalAlpha = 1;
            }

            function redraw() {
                drawGridAndAxes();
                ctx.save();
                for (let g of graphics) {
                    let alpha = g.alpha !== undefined ? g.alpha : 1;
                    let isHovered = (currentHoverGraphic === g);
                    if (g.type === "segment") drawSegment(g.points[0], g.points[1], g.color, g.lineWidth || 2.5, g.strokeDash, alpha, isHovered);
                    else if (g.type === "polygon") drawPolygon(g.points, g.color, g.lineWidth || 2.5, g.strokeDash, g.fill, g.fillColor, alpha, isHovered);
                    else if (g.type === "rectangle") drawRectangle(g.x, g.y, g.w, g.h, g.color, g.lineWidth || 2.5, g.strokeDash, g.fill, g.fillColor, alpha, isHovered);
                    else if (g.type === "ellipse") drawEllipse(g.cx, g.cy, g.rx, g.ry, g.color, g.lineWidth || 2.5, g.strokeDash, g.fill, g.fillColor, alpha, isHovered);
                    else if (g.type === "points") drawPoints(g.points, g.color, g.size || 6, alpha, isHovered);
                    else if (g.type === "paramPoint") drawParamPoint(g, alpha);
                    else if (g.type === "paramCurve") drawParamCurve(g, alpha);
                    else if (g.type === "text") {} else drawFunctionCurve(g, alpha, isHovered);
                }
                drawAnnotations();
                ctx.restore();
                updateFunctionListUI();
                updateZoomDisplay();
                updateEmptyHint();
            }

            function redrawWithAlpha() { redraw(); }

            // ========= Graphic Description =========
            function getGraphicDescription(g) {
                switch (g.type) {
                    case "circle": return `圆(圆心(${g.params.cx},${g.params.cy}) 半径${g.params.r})`;
                    case "ellipse": return `椭圆(中心(${g.cx},${g.cy}) rx=${g.rx} ry=${g.ry})`;
                    case "rectangle": return `矩形(x=${g.x} y=${g.y} 宽${g.w} 高${g.h})`;
                    case "polygon":
                        let n = g.points.length;
                        let sn = { 3: '三角形', 4: '四边形', 5: '五边形', 6: '六边形' };
                        return `${sn[n] || n + '边形'}(顶点${JSON.stringify(g.points)})`;
                    case "segment": return `线段(${JSON.stringify(g.points[0])}→${JSON.stringify(g.points[1])})`;
                    case "ray": return `射线(${JSON.stringify(g.points[0])}→${JSON.stringify(g.points[1])})`;
                    case "paramConn": return `连线(${g.xExpr1},${g.yExpr1})→(${g.xExpr2},${g.yExpr2})`;
                    case "points": return `散点(${g.points.length}个点)`;
                    case "line": return g.isVertical ? `垂直线(x=${g.params.x})` : `直线(y=${g.params.k}x+${g.params.b})`;
                    case "sin": return `正弦曲线(y=${g.params.A||1}·sin(${g.params.B||1}x+${g.params.C||0})+${g.params.D||0})`;
                    case "cos": return `余弦曲线(y=${g.params.A||1}·cos(${g.params.B||1}x+${g.params.C||0})+${g.params.D||0})`;
                    case "quadratic": return `抛物线(y=${g.params.a||1}x²+${g.params.b||0}x+${g.params.c||0})`;
                    case "inverse": return `反比例(y=${g.params.k||1}/x)`;
                    case "text": return `文字"${g.text}"@(${g.x},${g.y})`;
                    case "paramPoint": return `动点((${g.xExpr},${g.yExpr}) 标签:${g.label||''})`;
                    case "paramCurve": return `参数曲线(x(t)=${g.xExpr}, y(t)=${g.yExpr})`;
                    default: return g.type;
                }
            }

            function getGraphicShortLabel(g) {
                switch (g.type) {
                    case "circle": return `圆 r${g.params.r}`;
                    case "polygon":
                        let n = g.points.length;
                        let sn = { 3: '△', 4: '□', 5: '五边形', 6: '六边形' };
                        return sn[n] || n + '边形';
                    case "line": return g.isVertical ? `垂线x=${g.params.x}` : '直线';
                    case "sin": return '正弦';
                    case "cos": return '余弦';
                    case "quadratic": return '抛物线';
                    case "inverse": return '反比例';
                    case "ellipse": return '椭圆';
                    case "rectangle": return '矩形';
                    case "segment": return '线段';
                    case "ray": return '射线';
                    case "paramConn": return '连线';
                    case "points": return '散点';
                    case "text": return '文字';
                    case "paramPoint": return '动点·' + (g.label || 'P');
                    case "paramCurve": return '参数曲线';
                    default: return g.type;
                }
            }

            // ========= Graphics Context =========
            function buildGraphicsContext() {
                let lines = ["[当前画布图形列表 - 可使用delete指令删除指定id的图形]"];
                if (graphics.length === 0) {
                    lines.push("  (暂无图形)");
                } else {
                    for (let g of graphics) {
                        let desc = getGraphicDescription(g);
                        let fillInfo = '';
                        if (g.fill !== undefined) fillInfo = ` 填充:${g.fill ? '是' : '否'}`;
                        if (g.strokeDash && Array.isArray(g.strokeDash) && g.strokeDash.length > 0) fillInfo += ' 虚线:是';
                        lines.push(`  id:${g.id} 类型:${g.type} ${desc} 颜色:${g.color}${fillInfo}`);
                    }
                }
                if (sliders.length > 0) {
                    lines.push('[当前滑动条状态]');
                    for (let s of sliders) {
                        lines.push(`  变量${s.name} ∈ [${s.min}, ${s.max}] 当前值=${s.value.toFixed(3)} 步长=${s.step}`);
                    }
                    lines.push('动点(paramPoint)的参数方程(xExpr, yExpr)中可使用这些变量名');
                }
                return lines.join('\n');
            }

            // ========= Graphic Construction =========
            function createGraphicFromSpec(spec) {
                let id = Date.now() + Math.random();
                let { type, params = {}, color = "#6366f1", expression, points, x, y, w, h, cx, cy, rx, ry, lineWidth, strokeDash, fill, fillColor, size } = spec;
                if (type === "line") {
                    if (params.x !== undefined && params.k === undefined) return { id, type, params: { x: params.x }, color, expression, isVertical: true, getY: null, lineWidth, strokeDash };
                    else if (params.k !== undefined && params.b !== undefined) {
                        let getY = (x) => params.k * x + params.b;
                        return { id, type, params, color, expression, getY, isVertical: false, lineWidth, strokeDash };
                    } else return null;
                } else if (type === "circle") {
                    if (params.cx === undefined || params.cy === undefined || params.r === undefined) return null;
                    return { id, type, params, color, expression, getY: null, lineWidth, strokeDash, fill, fillColor };
                } else if (type === "ellipse") {
                    if (cx === undefined || cy === undefined || rx === undefined || ry === undefined) return null;
                    return { id, type, cx, cy, rx, ry, color, lineWidth, strokeDash, fill, fillColor };
                } else if (type === "rectangle") {
                    if (x === undefined || y === undefined || w === undefined || h === undefined) return null;
                    return { id, type, x, y, w, h, color, lineWidth, strokeDash, fill, fillColor };
                } else if (type === "points") {
                    if (!points || !Array.isArray(points)) return null;
                    return { id, type, points, color, size };
                } else if (type === "quadratic" || type === "inverse" || type === "sin" || type === "cos" || type === "exp" || type === "log" || type === "abs") {
                    let getY = null;
                    try {
                        if (type === "quadratic") { let { a = 1, b = 0, c = 0 } = params; getY = (x) => a * x * x + b * x + c; }
                        else if (type === "inverse") { let { k = 1 } = params; getY = (x) => (x === 0 ? undefined : k / x); }
                        else if (type === "sin") { let { A = 1, B = 1, C = 0, D = 0 } = params; getY = (x) => A * Math.sin(B * x + C) + D; }
                        else if (type === "cos") { let { A = 1, B = 1, C = 0, D = 0 } = params; getY = (x) => A * Math.cos(B * x + C) + D; }
                        else if (type === "exp") { let { a = 1, b = 1 } = params; getY = (x) => a * Math.exp(b * x); }
                        else if (type === "log") { let { base = Math.E, a = 1 } = params; getY = (x) => (x > 0 ? a * Math.log(x) / Math.log(base) : undefined); }
                        else if (type === "abs") { let { a = 1, b = 0, c = 0 } = params; getY = (x) => a * Math.abs(x - b) + c; }
                    } catch (e) { return null; }
                    return { id, type, params, color, expression, getY, lineWidth, strokeDash };
                } else if (type === "segment") {
                    if (points && points.length === 2) return { id, type, points, color, lineWidth, strokeDash };
                    return null;
                } else if (type === "ray") {
                    if (points && points.length === 2) return { id, type, points, color, lineWidth, strokeDash };
                    return null;
                } else if (type === "paramConn") {
                    if (!spec.xExpr1 || !spec.yExpr1 || !spec.xExpr2 || !spec.yExpr2) return null;
                    return { id, type, xExpr1: spec.xExpr1, yExpr1: spec.yExpr1, xExpr2: spec.xExpr2, yExpr2: spec.yExpr2, color, lineWidth, strokeDash, connType: spec.connType || 'segment' };
                } else if (type === "polygon") {
                    if (points && points.length >= 3) return { id, type, points, color, lineWidth, strokeDash, fill, fillColor };
                    return null;
                } else if (type === "text") {
                    if (!spec.text) return null;
                    return { id, type, text: spec.text, x: spec.x || 0, y: spec.y || 0, color: spec.color || "#e0e0f0", fontSize: spec.fontSize || 16 };
                } else if (type === "paramPoint") {
                    if (!spec.xExpr || !spec.yExpr) return null;
                    return { id, type, xExpr: spec.xExpr, yExpr: spec.yExpr, color, size: spec.size || 8, label: spec.label || '', trail: spec.trail || false, lineWidth: spec.lineWidth };
                } else if (type === "paramCurve") {
                    if (!spec.xExpr || !spec.yExpr) return null;
                    return { id, type, xExpr: spec.xExpr, yExpr: spec.yExpr, color, lineWidth: spec.lineWidth || 2, tMin: spec.tMin, tMax: spec.tMax };
                } else if (type === "namedPoint") {
                    return createGraphicFromSpec({ type: 'points', points: [[spec.x || 0, spec.y || 0]], color: spec.color || '#10b981', size: 7 });
                }
                return null;
            }

            function addGraphic(spec) {
                let g = createGraphicFromSpec(spec);
                if (!g) { setStatus("图形格式无效", "error"); return; }
                g.alpha = 0;
                graphics.push(g);
                let start = performance.now();
                function fadeIn(time) {
                    let t = Math.min((time - start) / 400, 1);
                    g.alpha = 1 - Math.pow(1 - t, 3);
                    redrawWithAlpha();
                    if (t < 1) requestAnimationFrame(fadeIn);
                    else { g.alpha = 1; redraw(); }
                }
                requestAnimationFrame(fadeIn);
            }

            function deleteGraphicById(id) {
                let idx = graphics.findIndex(g => g.id === id);
                if (idx === -1) return;
                let g = graphics[idx];
                let start = performance.now();
                function fadeOut(time) {
                    let t = Math.min((time - start) / 300, 1);
                    g.alpha = 1 - t;
                    redrawWithAlpha();
                    if (t < 1) requestAnimationFrame(fadeOut);
                    else { graphics.splice(idx, 1); redraw(); }
                }
                requestAnimationFrame(fadeOut);
            }

            function deleteAll() {
                if (graphics.length === 0 && sliders.length === 0 && namedPoints.length === 0) return;
                stopAllAnimations();
                sliders = [];
                graphics = [];
                namedPoints = [];
                selectedPoints = [];
                renderSliders();
                renderPoints();
                redraw();
                showToast('画布已清空', 'success');
            }

            function animateViewChange(targetXMin, targetXMax, targetYMin, targetYMax, duration = 400) {
                const startXMin = xMin, startXMax = xMax, startYMin = yMin, startYMax = yMax;
                const startTime = performance.now();
                function step(time) {
                    let t = Math.min((time - startTime) / duration, 1);
                    let ease = 1 - Math.pow(1 - t, 3);
                    xMin = startXMin + (targetXMin - startXMin) * ease;
                    xMax = startXMax + (targetXMax - startXMax) * ease;
                    yMin = startYMin + (targetYMin - startYMin) * ease;
                    yMax = startYMax + (targetYMax - startYMax) * ease;
                    redraw();
                    if (t < 1) requestAnimationFrame(step);
                }
                if (animFrameId) cancelAnimationFrame(animFrameId);
                animFrameId = requestAnimationFrame(step);
            }

            function zoom(factor, animated = true) {
                let cx = (xMin + xMax) / 2, cy = (yMin + yMax) / 2;
                let newW = Math.min(Math.max((xMax - xMin) * factor, 0.01), 500);
                let newH = Math.min(Math.max((yMax - yMin) * factor, 0.01), 500);
                if (animated) animateViewChange(cx - newW / 2, cx + newW / 2, cy - newH / 2, cy + newH / 2);
                else { xMin = cx - newW / 2; xMax = cx + newW / 2; yMin = cy - newH / 2; yMax = cy + newH / 2; redraw(); }
            }

            function fitToAllGraphics(animated = true) {
                if (graphics.length === 0) {
                    if (animated) animateViewChange(DEFAULT.xMin, DEFAULT.xMax, DEFAULT.yMin, DEFAULT.yMax);
                    else { xMin = DEFAULT.xMin; xMax = DEFAULT.xMax; yMin = DEFAULT.yMin; yMax = DEFAULT.yMax; redraw(); }
                    return;
                }
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                for (let g of graphics) {
                    if (g.type === "circle") { let { cx, cy, r } = g.params; minX = Math.min(minX, cx - r); maxX = Math.max(maxX, cx + r); minY = Math.min(minY, cy - r); maxY = Math.max(maxY, cy + r); }
                    else if (g.type === "ellipse") { minX = Math.min(minX, g.cx - g.rx); maxX = Math.max(maxX, g.cx + g.rx); minY = Math.min(minY, g.cy - g.ry); maxY = Math.max(maxY, g.cy + g.ry); }
                    else if (g.type === "rectangle") { minX = Math.min(minX, g.x); maxX = Math.max(maxX, g.x + g.w); minY = Math.min(minY, g.y); maxY = Math.max(maxY, g.y + g.h); }
                    else if (g.type === "points") { for (let p of g.points) { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); } }
                    else if (g.type === "segment" || g.type === "polygon") { for (let p of g.points) { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); } }
                    else if (g.type === "text") { minX = Math.min(minX, g.x); maxX = Math.max(maxX, g.x); minY = Math.min(minY, g.y); maxY = Math.max(maxY, g.y); }
                    else if (g.getY) { for (let x = -20; x <= 20; x += 0.2) { let y = g.getY(x); if (isFinite(y) && !isNaN(y)) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); } } }
                    else if (g.isVertical) { minX = Math.min(minX, g.params.x); maxX = Math.max(maxX, g.params.x); }
                }
                if (!isFinite(minX) || !isFinite(maxX) || !isFinite(minY) || !isFinite(maxY)) {
                    if (animated) animateViewChange(DEFAULT.xMin, DEFAULT.xMax, DEFAULT.yMin, DEFAULT.yMax);
                    else { xMin = DEFAULT.xMin; xMax = DEFAULT.xMax; yMin = DEFAULT.yMin; yMax = DEFAULT.yMax; redraw(); }
                    return;
                }
                // Maintain 1:1 aspect ratio
                let rangeX = maxX - minX, rangeY = maxY - minY;
                let range = Math.max(rangeX, rangeY) * 1.15 || 1;
                let centerX = (minX + maxX) / 2;
                let centerY = (minY + maxY) / 2;
                let half = range / 2;
                animateViewChange(centerX - half, centerX + half, centerY - half, centerY + half);
            }

            function resetView(animated = true) {
                if (animated) animateViewChange(DEFAULT.xMin, DEFAULT.xMax, DEFAULT.yMin, DEFAULT.yMax);
                else { xMin = DEFAULT.xMin; xMax = DEFAULT.xMax; yMin = DEFAULT.yMin; yMax = DEFAULT.yMax; redraw(); }
            }

            // ========= Save PNG =========
            function saveCanvasAsPNG() {
                const saveBtn = document.getElementById('saveBtn');
                const prevHover = currentHoverGraphic;
                currentHoverGraphic = null;
                const savedTrails = [];
                for (let g of graphics) {
                    if (g.type === 'paramPoint' && g.trail && g._trail) {
                        savedTrails.push({ g, trail: [...g._trail] });
                        g._trail = [];
                    }
                }
                redraw();
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                const filename = `hatscope_${timestamp}.png`;
                const restoreTrails = () => {
                    for (let st of savedTrails) st.g._trail = st.trail;
                    currentHoverGraphic = prevHover;
                    redraw();
                };
                if (canvas.toBlob) {
                    canvas.toBlob((blob) => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url; a.download = filename;
                        document.body.appendChild(a); a.click(); document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        flashSaveButton(saveBtn);
                        restoreTrails();
                    }, 'image/png');
                } else {
                    const dataURL = canvas.toDataURL('image/png');
                    const a = document.createElement('a');
                    a.href = dataURL; a.download = filename;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    flashSaveButton(saveBtn);
                    restoreTrails();
                }
            }

            function flashSaveButton(btn) {
                btn.classList.add('save-flash');
                showToast('图片已保存', 'success');
                setTimeout(() => btn.classList.remove('save-flash'), 1500);
            }

            // ========= System Prompt =========
            const SYSTEM_PROMPT = `你是一个数学绘图助手。坐标系范围 x∈[-6,6], y∈[-6,6]。
你必须只返回纯JSON对象或JSON数组，格式如下：
{"action":"add","functions":[{"type":"sin","params":{"A":1,"B":1,"C":0,"D":0},"color":"#6366f1","lineWidth":2.5}]}

            function extractJSON(text) {
                let cleaned = text.replace(/```json\s*|```\s*/gi, '').trim();
                let match = cleaned.match(/(\{[\s\S]*\}|\[[\s\S]*\])/);
                if (match) { try { return JSON.parse(match[0]); } catch (e) { return null; } }
                return null;
            }

            async function fetchAI(messages, onDelta) {
                const bodyObj = {
                    model: currentModel,
                    messages: messages,
                    stream: true,
                    temperature: 0.2,
                };
                if (deepThinkEnabled) bodyObj.thinking = { type: 'enabled' };
                else bodyObj.thinking = { type: 'disabled' };

                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` },
                    body: JSON.stringify(bodyObj),
                });
                if (!response.ok) throw new Error("API请求失败: " + response.status);
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "", fullReasoning = "", fullContent = "";
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const data = line.slice(6);
                            if (data === "[DONE]") continue;
                            try {
                                const json = JSON.parse(data);
                                const delta = json.choices[0].delta;
                                if (delta.reasoning_content) fullReasoning += delta.reasoning_content;
                                if (delta.content) fullContent += delta.content;
                                if (onDelta) onDelta(fullReasoning, fullContent);
                            } catch (e) {}
                        }
                    }
                }
                return { fullContent, reasoning: fullReasoning };
            }

            let conversationHistory = [{ role: "system", content: SYSTEM_PROMPT }];

            async function sendToAI(userMessage, isRetry = false) {
                if (!API_KEY) { setStatus("密钥未加载", "error"); return; }
                const thinkingDiv = document.getElementById("thinkingBox");
                setStatus(deepThinkEnabled ? "深度思考中..." : "思考中...", "thinking");
                thinkingDiv.innerHTML = "";
                thinkingDiv.classList.add("visible");

                const graphicsContext = buildGraphicsContext();
                const augmentedMessage = userMessage + "\n\n" + graphicsContext;
                let messages = [...conversationHistory, { role: "user", content: augmentedMessage }];

                try {
                    let finalContent = "", finalReasoning = "";
                    const result = await fetchAI(messages, (reasoning, content) => {
                        finalReasoning = reasoning; finalContent = content;
                        updateThinkingBox(thinkingDiv, reasoning, content);
                    });
                    finalContent = result.fullContent;
                    finalReasoning = result.reasoning;

                    let parsed = extractJSON(finalContent);
                    if (!parsed && !isRetry) {
                        setStatus("格式修正中...", "thinking");
                        const retryMessages = [
                            { role: "system", content: SYSTEM_PROMPT },
                            { role: "assistant", content: finalContent },
                            { role: "user", content: "请将上述内容转换为纯JSON格式。" },
                        ];
                        return retryWithMessages(retryMessages);
                    }
                    if (!parsed) throw new Error("解析失败，无法提取JSON");

                    let operations = Array.isArray(parsed) ? parsed : [parsed];
                    processOperations(operations);
                    setStatus("完成", "idle");
                    showToast('绘图完成', 'success');

                    conversationHistory.push({ role: "user", content: augmentedMessage }, { role: "assistant", content: finalContent });
                    if (conversationHistory.length > 22) conversationHistory.splice(1, 2);
                } catch (err) {
                    setStatus("请求失败", "error");
                    thinkingDiv.innerHTML = `<span style="color:var(--danger);">${err.message}</span>`;
                    showToast('请求失败: ' + err.message, 'error');
                }
            }

            function updateThinkingBox(thinkingDiv, reasoning, content) {
                let html = '';
                if (reasoning && reasoning.trim()) {
                    html += '<div class="reasoning-section"><div class="section-label">深度思考过程</div>' + escapeHTML(reasoning) + '</div>';
                }
                if (content && content.trim()) {
                    html += '<div class="content-section"><div class="section-label">回复</div>' + escapeHTML(content) + '</div>';
                }
                if (!html && deepThinkEnabled) html = '<span style="color:var(--text-tertiary);">等待深度思考...</span>';
                else if (!html) html = '<span style="color:var(--text-tertiary);">等待回复...</span>';
                thinkingDiv.innerHTML = html;
                thinkingDiv.scrollTop = thinkingDiv.scrollHeight;
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function processOperations(operations) {
                let toDeleteIds = [];
                let shouldDeleteAll = false;
                let toAdd = [];

                for (let cmd of operations) {
                    if (cmd.action === "delete_all") shouldDeleteAll = true;
                    else if (cmd.action === "delete" && cmd.targets && Array.isArray(cmd.targets)) toDeleteIds.push(...cmd.targets);
                    else if (cmd.action === "add" && cmd.functions) toAdd.push(...cmd.functions);
                }

                if (shouldDeleteAll) {
                    graphics = [];
                } else {
                    for (let id of toDeleteIds) {
                        let idx = graphics.findIndex(g => g.id === id);
                        if (idx !== -1) graphics.splice(idx, 1);
                    }
                }

                for (let spec of toAdd) addGraphic(spec);
                redraw();
            }

            async function retryWithMessages(messages) {
                const thinkingDiv = document.getElementById("thinkingBox");
                try {
                    let finalContent = "", finalReasoning = "";
                    const result = await fetchAI(messages, (reasoning, content) => {
                        finalReasoning = reasoning; finalContent = content;
                        updateThinkingBox(thinkingDiv, reasoning, content);
                    });
                    finalContent = result.fullContent;
                    let parsed = extractJSON(finalContent);
                    if (!parsed) throw new Error("修正后仍无法解析JSON");
                    let operations = Array.isArray(parsed) ? parsed : [parsed];
                    processOperations(operations);
                    setStatus("完成", "idle");
                } catch (err) {
                    setStatus("修正失败", "error");
                    thinkingDiv.innerHTML = `<span style="color:var(--danger);">${err.message}</span>`;
                }
            }

            function updateFunctionListUI() {
                let container = document.getElementById("functionList");
                if (!container) return;
                if (graphics.length === 0) {
                    container.innerHTML = '<span class="func-empty">暂无图形</span>';
                    return;
                }
                let html = "";
                for (let g of graphics) {
                    let label = getGraphicShortLabel(g);
                    html += `<div class="func-badge" title="id:${g.id} | ${getGraphicDescription(g)}"><span class="color-dot" style="background:${g.color}"></span>${label}<button class="del-btn" onclick="window.hatscope.deleteGraphic(${g.id})" title="删除此图形">\u00D7</button></div>`;
                }
                container.innerHTML = html;
            }

            window.hatscope = { deleteGraphic: deleteGraphicById };

            // ========= Interaction =========
            function setupInteraction() {
                let isPan = false, panStartX, panStartY, startXMin, startXMax, startYMin, startYMax;
                canvas.addEventListener("mousedown", (e) => {
                    let rect = canvas.getBoundingClientRect();
                    let sx = LOGICAL_W / rect.width, sy = LOGICAL_H / rect.height;
                    let mx = (e.clientX - rect.left) * sx, my = (e.clientY - rect.top) * sy;
                    if (mx >= 0 && mx <= LOGICAL_W && my >= 0 && my <= LOGICAL_H) {
                        isPan = true; panStartX = mx; panStartY = my;
                        startXMin = xMin; startXMax = xMax; startYMin = yMin; startYMax = yMax;
                        canvas.style.cursor = "grabbing";
                    }
                });
                window.addEventListener("mousemove", (e) => {
                    let rect = canvas.getBoundingClientRect();
                    let sx = LOGICAL_W / rect.width, sy = LOGICAL_H / rect.height;
                    let mx = (e.clientX - rect.left) * sx, my = (e.clientY - rect.top) * sy;
                    if (mx >= 0 && mx <= LOGICAL_W && my >= 0 && my <= LOGICAL_H) {
                        let { x, y } = pixelToWorld(mx, my);
                        document.getElementById("coordX").innerText = x.toFixed(3);
                        document.getElementById("coordY").innerText = y.toFixed(3);
                    }
                    if (isPan) {
                        let dx = (panStartX - mx) / LOGICAL_W * (startXMax - startXMin);
                        let dy = (panStartY - my) / LOGICAL_H * (startYMax - startYMin);
                        xMin = startXMin + dx; xMax = startXMax + dx;
                        yMin = startYMin + dy; yMax = startYMax + dy;
                        redraw();
                    }
                });
                window.addEventListener("mouseup", () => { isPan = false; canvas.style.cursor = "crosshair"; });

                canvas.addEventListener("wheel", (e) => {
                    e.preventDefault();
                    let rect = canvas.getBoundingClientRect();
                    let sx = LOGICAL_W / rect.width, sy = LOGICAL_H / rect.height;
                    let mx = (e.clientX - rect.left) * sx, my = (e.clientY - rect.top) * sy;
                    let center = pixelToWorld(mx, my);
                    let factor = e.deltaY > 0 ? 1.1 : 0.9;
                    let newW = Math.min(Math.max((xMax - xMin) * factor, 0.01), 500);
                    let newH = Math.min(Math.max((yMax - yMin) * factor, 0.01), 500);
                    let newXMin = center.x - (center.x - xMin) / (xMax - xMin) * newW;
                    let newYMin = center.y - (center.y - yMin) / (yMax - yMin) * newH;
                    animateViewChange(newXMin, newXMin + newW, newYMin, newYMin + newH);
                }, { passive: false });

                // Touch
                let touchStartDist = 0, touchStartCenter = null;
                canvas.addEventListener("touchstart", (e) => {
                    if (e.touches.length === 1) {
                        let rect = canvas.getBoundingClientRect();
                        let sx = LOGICAL_W / rect.width, sy = LOGICAL_H / rect.height;
                        panStartX = (e.touches[0].clientX - rect.left) * sx;
                        panStartY = (e.touches[0].clientY - rect.top) * sy;
                        isPan = true;
                        startXMin = xMin; startXMax = xMax; startYMin = yMin; startYMax = yMax;
                    } else if (e.touches.length === 2) {
                        isPan = false;
                        let dx = e.touches[0].clientX - e.touches[1].clientX;
                        let dy = e.touches[0].clientY - e.touches[1].clientY;
                        touchStartDist = Math.sqrt(dx * dx + dy * dy);
                        let rect = canvas.getBoundingClientRect();
                        let sx = LOGICAL_W / rect.width, sy = LOGICAL_H / rect.height;
                        let cmx = ((e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left) * sx;
                        let cmy = ((e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top) * sy;
                        touchStartCenter = pixelToWorld(cmx, cmy);
                        startXMin = xMin; startXMax = xMax; startYMin = yMin; startYMax = yMax;
                    }
                }, { passive: true });
                canvas.addEventListener("touchmove", (e) => {
                    e.preventDefault();
                    if (e.touches.length === 1 && isPan) {
                        let rect = canvas.getBoundingClientRect();
                        let sx = LOGICAL_W / rect.width, sy = LOGICAL_H / rect.height;
                        let mx = (e.touches[0].clientX - rect.left) * sx;
                        let my = (e.touches[0].clientY - rect.top) * sy;
                        let dx = (panStartX - mx) / LOGICAL_W * (startXMax - startXMin);
                        let dy = (panStartY - my) / LOGICAL_H * (startYMax - startYMin);
                        xMin = startXMin + dx; xMax = startXMax + dx;
                        yMin = startYMin + dy; yMax = startYMax + dy;
                        redraw();
                    } else if (e.touches.length === 2 && touchStartCenter) {
                        let dx = e.touches[0].clientX - e.touches[1].clientX;
                        let dy = e.touches[0].clientY - e.touches[1].clientY;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        let scale = touchStartDist / dist;
                        let newW = Math.min(Math.max((startXMax - startXMin) * scale, 0.01), 500);
                        let newH = Math.min(Math.max((startYMax - startYMin) * scale, 0.01), 500);
                        xMin = touchStartCenter.x - (touchStartCenter.x - startXMin) / (startXMax - startXMin) * newW;
                        xMax = xMin + newW;
                        yMin = touchStartCenter.y - (touchStartCenter.y - startYMin) / (startYMax - startYMin) * newH;
                        yMax = yMin + newH;
                        redraw();
                    }
                }, { passive: false });
                canvas.addEventListener("touchend", () => { isPan = false; touchStartCenter = null; });

                // Canvas control buttons
                document.getElementById("zoomInBtn").addEventListener("click", () => zoom(0.9, true));
                document.getElementById("zoomOutBtn").addEventListener("click", () => zoom(1.1, true));
                document.getElementById("fitViewBtn").addEventListener("click", () => fitToAllGraphics(true));
                document.getElementById("resetViewBtn").addEventListener("click", () => resetView(true));
                document.getElementById("saveBtn").addEventListener("click", () => saveCanvasAsPNG());
                document.getElementById("clearAllBtn").addEventListener("click", () => deleteAll());
            }

            async function loadApiKey() {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) { API_KEY = cached; return true; }
                try {
                    const res = await fetch('https://api.textdb.online/maoziaikey');
                    if (res.ok) {
                        const text = await res.text();
                        if (text && text.trim() !== 'null') {
                            API_KEY = text.trim();
                            localStorage.setItem(CACHE_KEY, API_KEY);
                            return true;
                        }
                    }
                    throw new Error('获取失败');
                } catch (e) { return false; }
            }

            window.addEventListener('load', async () => {
                loadTheme();
                canvas = document.getElementById("cartesianCanvas");
                ctx = canvas.getContext("2d");
                loadSettings();
                setupInteraction();
                buildToolbar();
                resetView(false);

                const keyReady = await loadApiKey();
                if (keyReady) {
                    document.getElementById("sendBtn").addEventListener("click", () => {
                        let input = document.getElementById("userInput");
                        let msg = input.value.trim();
                        if (!msg) return;
                        input.value = "";
                        sendToAI(msg);
                    });
                    document.getElementById("userInput").addEventListener("keypress", (e) => {
                        if (e.key === "Enter") document.getElementById("sendBtn").click();
                    });
                } else {
                    document.getElementById("sendBtn").disabled = true;
                    setStatus("密钥未加载，请刷新重试", "error");
                }

                document.getElementById("btnFlash").addEventListener("click", () => {
                    currentModel = "deepseek-v4-flash"; saveModelSetting(); updateModelButtons();
                });
                document.getElementById("btnPro").addEventListener("click", () => {
                    currentModel = "deepseek-v4-pro"; saveModelSetting(); updateModelButtons();
                });
                document.getElementById("btnDeepThink").addEventListener("click", () => {
                    deepThinkEnabled = !deepThinkEnabled;
                    saveDeepThinkSetting(); updateDeepThinkButton();
                    showToast(deepThinkEnabled ? '深度思考已启用' : '深度思考已关闭', 'info');
                    setStatus(deepThinkEnabled ? "深度思考已启用" : "深度思考已关闭", "idle");
                    setTimeout(() => setStatus("就绪", "idle"), 2000);
                });
                document.getElementById("themeToggle").addEventListener("click", toggleTheme);

                document.getElementById("addSliderBtn").addEventListener("click", toggleAddSliderPopup);
                document.getElementById("sliderConfirmBtn").addEventListener("click", confirmAddSlider);
                document.getElementById("sliderCancelBtn").addEventListener("click", () => {
                    document.getElementById('sliderAddPopup').classList.remove('visible');
                });
                document.getElementById("sliderAddPopup").addEventListener("keypress", (e) => {
                    if (e.key === "Enter") confirmAddSlider();
                });

                document.getElementById("btnSegment").addEventListener("click", () => connectPoints('segment'));
                document.getElementById("btnLine").addEventListener("click", () => connectPoints('line'));
                document.getElementById("btnRay").addEventListener("click", () => connectPoints('ray'));

                document.getElementById("kbToggleBtn").addEventListener("click", toggleKeyboard);
                buildKeyboard();
            });
        })();
    </script>
